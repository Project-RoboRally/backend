spring.application.name=backend
app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000
app.user-store=./data/users.json
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework