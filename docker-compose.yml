services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roborally
      POSTGRES_USER: roborally
      POSTGRES_PASSWORD: roborally-password!2026
    ports:
      - "5432:5432"
    volumes:
      - roborally-postgres:/var/lib/postgresql/data

  # Adminer database UI
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  roborally-postgres: